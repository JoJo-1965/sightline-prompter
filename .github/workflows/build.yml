# Installers for Windows, macOS (Apple silicon and Intel) and Linux.
# Runs the tests, then builds with electron-builder (package.json "build").
# A push of a version tag (v1.0.0) also gathers the installers into a DRAFT
# release, which stays hidden until it is published by hand.
name: Build installers

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            files: dist/*.exe
          - os: macos-latest
            label: macos-apple-silicon
            files: dist/*.dmg
          - os: macos-13
            label: macos-intel
            files: dist/*.dmg
          - os: ubuntu-latest
            label: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # Not code-signed yet (see the roadmap): don't look for certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build installer
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: sightline-${{ matrix.label }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
