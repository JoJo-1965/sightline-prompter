<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Control pad</title>
  <link rel="stylesheet" href="pad.css" />
</head>
<body>
  <div id="pad">
    <header id="pad-grip"><span>⠿ Control pad</span><button id="pad-customise" type="button">Customise</button><button id="pad-close" type="button" aria-label="Hide the pad">×</button></header>
    <div id="pad-buttons" class="control-grid" role="group" aria-label="Prompter controls"></div>
    <p id="pad-feedback" class="control-feedback" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="pad.js"></script>
</body>
</html>
