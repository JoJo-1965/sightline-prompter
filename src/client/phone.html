<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18181c" />
  <title>Sightline remote</title>
  <link rel="stylesheet" href="/assets/pad.css" />
  <style>
    html,body { height: auto; min-height: 100%; overflow: auto; background: #18181c; color: #f2f2f2; touch-action: manipulation; }
    main { max-width: 720px; margin: auto; padding: max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(max(16px,env(safe-area-inset-bottom)) + 24px) max(16px,env(safe-area-inset-left)); }
    #status { min-height: 72px; text-align: center; line-height: 1.5; }
    #state { font-size: 20px; font-weight: bold; }
    #state.offline { color: #ffb4a9; }
    #section { text-wrap: pretty; }
    .control-grid { gap: 10px; overflow: visible; }
    .control-grid button { min-height: 96px; font-size: 16px; padding: 10px 6px; }
    .control-icon { font-size: 30px; }
    .control-icon svg { width: 32px; height: 32px; }
    #connection-note { color: #bdc8d8; font-size: 14px; text-wrap: pretty; }
    @media(max-width:500px) { .control-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media(orientation:landscape) and (min-width:600px) and (max-height:600px) {
      main { max-width: 1200px; padding-top: max(8px,env(safe-area-inset-top)); padding-bottom: calc(max(12px,env(safe-area-inset-bottom)) + 16px); }
      #status { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 12px; min-height: 0; margin-bottom: 8px; font-size: 13px; line-height: 1.3; }
      #state { font-size: 16px; }
      #section { order: 1; flex-basis: 100%; font-size: 14px; }
      .control-grid { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; }
      .control-grid:has(button:nth-child(9)) { grid-template-columns: repeat(6,minmax(0,1fr)); }
      .control-grid button { min-height: 64px; padding: 7px 4px; font-size: 14px; gap: 4px; }
      .control-icon svg { width: 24px; height: 24px; }
      #connection-note { margin: 10px 0 0; font-size: 12px; line-height: 1.3; }
    }
  </style>
</head>
<body>
  <main>
    <div id="status" role="status" aria-live="polite"><div id="state">Connecting…</div><div id="section"></div><div id="obs-status"></div></div>
    <div id="phone-buttons" class="control-grid" role="group" aria-label="Prompter controls"></div>
    <p id="connection-note">Matches your floating pad. Customise in Sightline: Settings › Controls › Pad.</p>
  </main>
  <script type="module" src="/assets/phone-controls.js"></script>
</body>
</html>
