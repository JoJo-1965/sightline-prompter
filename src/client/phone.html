<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#18181c" />
    <title>Sightline remote</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #18181c;
        color: #f2f2f2;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        gap: 12px;
        height: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px
          max(16px, env(safe-area-inset-bottom));
      }
      #status {
        min-height: 3.2em;
        text-align: center;
        font-size: 15px;
        line-height: 1.4;
      }
      #state {
        font-weight: 700;
        font-size: 18px;
      }
      #state.offline {
        color: #ffb4a9;
      }
      #section {
        opacity: 0.8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        border: 0;
        border-radius: 18px;
        background: #2c2c33;
        color: inherit;
        font: inherit;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 72px;
      }
      button:active {
        background: #44444d;
      }
      button:disabled {
        opacity: 0.4;
      }
      button svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }
      #toggle {
        background: #2e7d32;
        font-size: 26px;
      }
      #toggle svg {
        width: 64px;
        height: 64px;
      }
      #toggle:active {
        background: #388e3c;
      }
      #toggle.running {
        background: #b23b3b;
      }
      #toggle .pause,
      #toggle.running .play {
        display: none;
      }
      #toggle.running .pause {
        display: block;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .row.three {
        grid-template-columns: 1fr 1fr 1fr;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="status" role="status" aria-live="polite">
        <div id="state">Connecting…</div>
        <div id="section"></div>
      </div>
      <button id="toggle" data-action="toggle" aria-label="Start or pause">
        <svg class="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" /></svg>
        <svg class="pause" viewBox="0 0 24 24">
          <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
        </svg>
        <span id="toggle-label">Start</span>
      </button>
      <div class="row">
        <button data-action="previous-section" id="prev">
          <svg viewBox="0 0 24 24"><path d="M16 4v16L5 12z" /></svg
          ><span>Previous</span>
        </button>
        <button data-action="next-section" id="next">
          <svg viewBox="0 0 24 24"><path d="M8 4v16l11-8z" /></svg
          ><span>Next</span>
        </button>
      </div>
      <div class="row three">
        <button data-action="restart">
          <svg viewBox="0 0 24 24">
            <path d="M5 4h2.5v16H5zM20 4v16L9 12z" /></svg
          ><span>Top</span>
        </button>
        <button data-action="slower">
          <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z" /></svg
          ><span>Slower</span>
        </button>
        <button data-action="faster">
          <svg viewBox="0 0 24 24">
            <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg
          ><span>Faster</span>
        </button>
      </div>
      <button data-action="marker">
        <span>Drop a marker</span>
      </button>
    </main>
    <script>
      const key = new URLSearchParams(location.search).get("k") ?? "";
      const headers = { "X-Sightline-Key": key };
      const state = document.getElementById("state");
      const section = document.getElementById("section");
      const toggle = document.getElementById("toggle");
      const toggleLabel = document.getElementById("toggle-label");
      const buttons = document.querySelectorAll("button[data-action]");

      function show(s) {
        const running = !!s.scrolling;
        toggle.classList.toggle("running", running);
        toggleLabel.textContent = running ? "Pause" : "Start";
        state.classList.remove("offline");
        state.textContent = s.editing
          ? "Editing the script"
          : running
            ? "Running"
            : "Paused";
        const parts = [];
        if (s.sectionTitle) parts.push(s.sectionTitle);
        if (s.progress) parts.push(s.progress);
        section.textContent = parts.join(" · ");
        const unit = s.points ? "point" : "section";
        document.getElementById("prev").lastElementChild.textContent =
          `Previous ${unit}`;
        document.getElementById("next").lastElementChild.textContent =
          `Next ${unit}`;
        for (const b of buttons) b.disabled = !!s.editing;
      }

      function offline() {
        state.textContent = "Can't reach the prompter";
        state.classList.add("offline");
        section.textContent =
          "Check the phone remote is on and you're on the same Wi-Fi";
      }

      async function poll() {
        try {
          const res = await fetch("/status", { headers, cache: "no-store" });
          if (!res.ok) throw new Error(res.status);
          show(await res.json());
        } catch {
          offline();
        }
      }

      for (const b of buttons) {
        b.addEventListener("click", async () => {
          navigator.vibrate?.(15);
          try {
            await fetch(
              `/command?action=${encodeURIComponent(b.dataset.action)}`,
              { method: "POST", headers },
            );
          } catch {
            offline();
          }
          setTimeout(poll, 150);
        });
      }
      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
