<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:"
    />
    <title>Sightline Control</title>
    <link rel="stylesheet" type="text/css" href="control.css" />
  </head>
  <body>
    <header id="top">
      <div id="state" role="status" aria-live="polite">
        <span id="state-dot" aria-hidden="true"></span>
        <span id="state-text">Waiting for the prompter…</span>
      </div>
      <div id="section"></div>
      <div id="progress"></div>
      <div id="text-size" role="group" aria-label="Preview text size">
        <button type="button" id="size-down" title="Smaller preview text">
          A−
        </button>
        <button type="button" id="size-up" title="Bigger preview text">
          A+
        </button>
      </div>
    </header>

    <div id="pacing" class="hidden" aria-live="off"></div>

    <main
      id="preview"
      tabindex="-1"
      aria-label="Live copy of the script. Click a line to move the prompter there."
    >
      <div id="reading-line" aria-hidden="true"></div>
      <div id="md"></div>
      <p id="empty">Open a script in the prompter and it appears here.</p>
    </main>

    <footer id="buttons" role="toolbar" aria-label="Prompter controls">
      <button
        type="button"
        data-action="restart"
        title="Back to the top (Home)"
      >
        <svg viewBox="0 0 24 24"><path d="M5 4h2.5v16H5zM20 4v16L9 12z" /></svg>
        <span>Top</span>
      </button>
      <button
        type="button"
        data-action="previous-section"
        id="prev"
        title="Previous section (Page Up)"
      >
        <svg viewBox="0 0 24 24"><path d="M16 4v16L5 12z" /></svg>
        <span>Previous</span>
      </button>
      <button
        type="button"
        data-action="toggle"
        id="toggle"
        class="primary"
        title="Start or pause (Space)"
      >
        <svg viewBox="0 0 24 24" class="icon-play">
          <path d="M7 4v16l13-8z" />
        </svg>
        <svg viewBox="0 0 24 24" class="icon-pause">
          <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
        </svg>
        <span id="toggle-label">Start</span>
      </button>
      <button
        type="button"
        data-action="next-section"
        id="next"
        title="Next section (Page Down)"
      >
        <svg viewBox="0 0 24 24"><path d="M8 4v16l11-8z" /></svg>
        <span>Next</span>
      </button>
      <button type="button" data-action="slower" title="Slower (↓)">
        <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z" /></svg>
        <span>Slower</span>
      </button>
      <div id="speed" title="Scrolling speed"></div>
      <button type="button" data-action="faster" title="Faster (↑)">
        <svg viewBox="0 0 24 24">
          <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
        </svg>
        <span>Faster</span>
      </button>
      <button
        type="button"
        data-action="marker"
        title="Drop a marker at the reading line (B)"
      >
        <svg viewBox="0 0 24 24">
          <path d="M6 3h2v18H6zM9 4h10l-3 4 3 4H9z" />
        </svg>
        <span>Marker</span>
      </button>
    </footer>
    <footer id="broadcast" role="toolbar" aria-label="The prompter's broadcast settings">
      <button type="button" class="toggle on-air" data-action="on-air" id="b-on-air" title="On air or off air: the on-air backing and the ON AIR light">
        <span class="dot" aria-hidden="true"></span>On air
      </button>
      <div class="stepper" role="group" aria-label="Text size on the prompter">
        <span class="label">Text</span>
        <button type="button" data-action="smaller" title="Smaller text on the prompter">−</button>
        <output id="b-size">–</output>
        <button type="button" data-action="bigger" title="Bigger text on the prompter">+</button>
      </div>
      <div class="stepper" role="group" aria-label="Backing behind the text">
        <span class="label">Backing</span>
        <button type="button" data-action="backing" data-value="-1" title="Less backing behind the text">−</button>
        <output id="b-backing">–</output>
        <button type="button" data-action="backing" data-value="1" title="More backing behind the text">+</button>
      </div>
      <button type="button" class="toggle" data-action="mirror-h" id="b-mirror-h" title="Mirror left–right, for a beam splitter">↔ Mirror</button>
      <button type="button" class="toggle" data-action="mirror-v" id="b-mirror-v" title="Mirror up–down">↕ Mirror</button>
      <button type="button" class="toggle" data-action="eye-line" id="b-eye-line" title="Eye-line mode: a strip at the top of the screen, under the webcam">Eye-line</button>
      <button type="button" class="toggle" data-action="sound-check" id="b-sound-check" title="Sound check: the mic's level, loudness and the room's background noise, here and on the prompter when it isn't running (Ctrl+Shift+D)">Sound check</button>
      <div id="b-meter" class="hidden" role="status" aria-label="Microphone level">
        <div class="m-bar"><div class="m-fill"></div><div class="m-hold"></div></div>
        <span class="m-clip">CLIP</span>
        <span class="m-text"></span>
      </div>
    </footer>
    <script type="module" src="control.js"></script>
  </body>
</html>
